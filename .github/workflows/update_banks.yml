name: Update Bank Data

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 requests python-dotenv
          playwright install chromium

      - name: Run scraper
        run: python scraper/runner.py

      - name: Update scraped data
        run: python scraper/update_bank_docs.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add data/scraped_banks.py
          git diff --staged --quiet || git commit -m "auto: update bank data $(date +%Y-%m-%d)"
          git push
